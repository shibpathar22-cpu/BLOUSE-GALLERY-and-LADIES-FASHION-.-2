
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Capacitor
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/android
          npm install --save-dev --legacy-peer-deps @capacitor/cli

      - name: Create Capacitor config if missing
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            printf '%s\n' \
              '{' \
              '  "appId": "com.blousegallery.ladiesfashion",' \
              '  "appName": "Blouse Gallery & Ladies Fashion",' \
              '  "webDir": "dist"' \
              '}' > capacitor.config.json
          fi

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Blouse-Gallery-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
